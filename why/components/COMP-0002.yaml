id: COMP-0002
name: HTTP Service
purpose: >-
  Starts the ledger and exposes its HTTP API.
scope:
  - >-
    Parses the command line and starts either the server or the migration run.
  - >-
    Routes every request of the ledger API and maps each outcome to its status code.
  - >-
    Parses request bodies, paths and query parameters and rejects malformed ones before any storage call.
  - >-
    Answers the liveness and readiness probes.
  - >-
    Logs the duration and outcome of Read API requests.
out_of_scope:
  - description: Validating the content of an ingested document.
    owner: COMP-0003
  - description: Storing and querying data.
    owner: COMP-0007
  - description: Reading the runtime settings from the environment.
    owner: COMP-0001
must_not:
  - >-
    Migrate the database when the service starts.
  - >-
    Make the liveness probe depend on the database.
  - >-
    Change stored data while serving a read.
files:
  - src/http.rs
  - src/lib.rs
  - src/main.rs
depends_on:
  - COMP-0001
  - COMP-0003
  - COMP-0004
  - COMP-0005
  - COMP-0006
  - COMP-0007
