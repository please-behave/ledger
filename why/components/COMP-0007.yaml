id: COMP-0007
name: Persistence
purpose: >-
  Owns the database schema and every statement that stores or reads attestations, registrations and facts.
scope:
  - >-
    Applies the forward-only migrations and reports whether the schema the build requires is present.
  - >-
    Appends attestations with their results and rule set bindings in one transaction and never updates them.
  - >-
    Stores rule and Rule Set registrations append-only and verifies Rule Set members against stored rules.
  - >-
    Stores release facts, deployment targets and deployment events, and resolves deployed versions through release facts at read time.
  - >-
    Serves the paged and filtered reads of attestations, rules, Rule Sets, releases, deployments and commit evidence.
out_of_scope:
  - description: Validating documents against the ingest contracts.
    owner: COMP-0003
  - description: Storing platform syncs and reading the repository overview.
    owner: COMP-0006
  - description: Routing and status codes.
    owner: COMP-0002
must_not:
  - >-
    Migrate when a connection is opened.
  - >-
    Update or delete a stored attestation.
  - >-
    Build a statement from request values other than through bound parameters.
files:
  - src/database.rs
  - migrations/20261121000000_create_attestations.sql
  - migrations/20261122000000_add_rule_identity.sql
  - migrations/20261122000001_index_rule_identity_version.sql
  - migrations/20261122000002_create_rule_registrations.sql
  - migrations/20261125000000_create_rule_set_registrations.sql
  - migrations/20261125000001_add_attestation_rule_sets.sql
  - migrations/20261125000002_create_release_facts.sql
  - migrations/20261126000000_create_deployment_targets.sql
  - migrations/20261126000001_create_deployment_events.sql
  - migrations/20261126000002_index_current_deployment.sql
  - migrations/20261126000003_create_platform_facts.sql
