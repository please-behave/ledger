id: REQ-0032
name: Stored Rule Identity on Attestation Results
description: >-
  An attestation detail read must include each result's stored rule source,
  path and local ID as a rule identity, with its version when stored. The
  ledger must return these values as stored, omit the identity when none was
  reported and omit the digest from the identity.
rationale: >-
  Readers can link a result to the rule version it ran with.
