id: REQ-0031
name: Registered Rule Name on Attestation Results
description: >-
  The ledger must include the stored name of the registration matching a
  result's rule source, path, local ID and version in an attestation detail
  read, regardless of the digests. It must omit the name when the registration
  is missing or has no name.
rationale: >-
  Readers can show the registered rule's display name without an additional
  registry request.
