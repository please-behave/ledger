id: REQ-0004
name: Readiness Reflects the Schema
description: >-
  `GET /readyz` must answer with success only when the database is reachable
  and every migration that the running build requires is applied, and with a
  failure status otherwise.
rationale: >-
  Traffic must reach an instance only when it can work with the database as it
  is.
decisions:
  - DEC-0003
